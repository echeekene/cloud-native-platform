# Everything that runs in the cluster. Apply with:
#   kubectl apply -k .
# Lives at the project root so the ConfigMaps can be built straight from the
# same files docker compose uses, with no copies to drift apart.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - k8s/base/namespace.yaml
  - k8s/base/network-policies.yaml
  - k8s/dns/deployment.yaml
  - k8s/dns/service.yaml
  - k8s/ntp/deployment.yaml
  - k8s/ntp/service.yaml
  - k8s/status-api/deployment.yaml
  - k8s/status-api/service.yaml
  - k8s/status-api/ingress.yaml
  - k8s/monitoring/namespace.yaml
  - k8s/monitoring/prometheus/rbac.yaml
  - k8s/monitoring/prometheus/deployment.yaml
  - k8s/monitoring/grafana/deployment.yaml

configMapGenerator:
  - name: coredns-config
    namespace: platform
    files:
      - services/dns/Corefile
      - services/dns/zones/db.platform.internal
  - name: prometheus-config
    namespace: monitoring
    files:
      - k8s/monitoring/prometheus/prometheus.yml
      - k8s/monitoring/prometheus/alerts.yml
  - name: grafana-config
    namespace: monitoring
    files:
      - datasource.yaml=k8s/monitoring/grafana/datasource.yaml
      - dashboards.yaml=k8s/monitoring/grafana/dashboards.yaml
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - k8s/monitoring/grafana/platform-overview.json

images:
  - name: ghcr.io/echeekene/status-api
    newTag: latest
  - name: ghcr.io/echeekene/chrony
    newTag: latest

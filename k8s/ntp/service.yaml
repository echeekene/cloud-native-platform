apiVersion: v1
kind: Service
metadata:
  name: chrony
  namespace: platform
spec:
  selector: { app: chrony }
  ports:
    - { name: ntp, port: 123, targetPort: 123, protocol: UDP }
---
apiVersion: v1
kind: Service
metadata:
  name: chrony-public
  namespace: platform
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: { app: chrony }
  ports:
    - { name: ntp, port: 123, targetPort: 123, protocol: UDP }

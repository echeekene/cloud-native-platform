- name: Create platform directory
  ansible.builtin.file:
    path: "{{ platform_dir }}"
    state: directory
    mode: "0755"

- name: Clone the repo
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ platform_dir }}/repo"
    version: main
    update: false

- name: Install the deploy script
  ansible.builtin.template:
    src: platform-deploy.sh.j2
    dest: /usr/local/bin/platform-deploy
    mode: "0755"

- name: Get current commit
  ansible.builtin.command: git -C {{ platform_dir }}/repo rev-parse HEAD
  register: head
  changed_when: false

- name: First deploy
  ansible.builtin.command: /usr/local/bin/platform-deploy {{ head.stdout }}
  register: deploy
  changed_when: true

- name: Show deploy output
  ansible.builtin.debug:
    var: deploy.stdout_lines

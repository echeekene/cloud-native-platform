- name: Create platform directory
  ansible.builtin.file:
    path: "{{ platform_dir }}"
    state: directory
    mode: "0755"

- name: Clone the repo
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ platform_dir }}/repo"
    version: main
    update: false
  register: platform_repo

- name: Install the deploy script
  ansible.builtin.template:
    src: platform-deploy.sh.j2
    dest: /usr/local/bin/platform-deploy
    mode: "0755"

- name: First deploy
  ansible.builtin.command: /usr/local/bin/platform-deploy {{ platform_repo.after }}
  register: platform_deploy_output
  changed_when: true

- name: Show deploy output
  ansible.builtin.debug:
    var: platform_deploy_output.stdout_lines

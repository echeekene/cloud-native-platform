name: Platform deploy

on:
  workflow_run:
    workflows: ["Platform CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # for the AWS OIDC token

concurrency:
  group: platform-deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Publish images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: status-api, context: services/status-api }
          - { name: chrony, context: services/ntp }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: VERSION=${{ github.event.workflow_run.head_sha || github.sha }}
          tags: |
            ghcr.io/echeekene/${{ matrix.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ghcr.io/echeekene/${{ matrix.name }}:latest
      - name: Scan pushed image
        run: |
          docker run --rm \
            -e TRIVY_USERNAME="${{ github.actor }}" \
            -e TRIVY_PASSWORD="${{ secrets.GITHUB_TOKEN }}" \
            aquasec/trivy:latest image --severity CRITICAL --ignore-unfixed --exit-code 1 \
            ghcr.io/echeekene/${{ matrix.name }}:${{ github.event.workflow_run.head_sha || github.sha }}

  deploy:
    name: Roll out over SSM
    needs: publish
    if: vars.PLATFORM_DEPLOY_ROLE_ARN
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Get temporary AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.PLATFORM_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Send deploy command
        id: send
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.PLATFORM_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${SHA::7}" \
            --parameters "commands=[\"/usr/local/bin/platform-deploy ${SHA}\"]" \
            --query Command.CommandId --output text)
          echo "id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for result
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.send.outputs.id }}" \
              --instance-id "${{ vars.PLATFORM_INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.id }}" \
            --instance-id "${{ vars.PLATFORM_INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          [ "$STATUS" = "Success" ]

      - name: Public smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://status.ekeneeche.com/api/status | jq .overall

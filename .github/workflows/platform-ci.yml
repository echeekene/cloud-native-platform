name: Platform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go test and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/status-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/status-api/go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - name: Validate bootstrap
        working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false && terraform validate

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render with kustomize
        run: kubectl kustomize . > rendered.yaml
      - name: Validate schemas with kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml
      - name: Check Prometheus rules
        run: |
          docker run --rm -v "$PWD/k8s/monitoring/prometheus:/p" --entrypoint promtool \
            prom/prometheus:v3.1.0 check rules /p/alerts.yml

  ansible:
    name: Ansible lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@v5
      - run: pip install ansible-core ansible-lint
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-playbook site.yml --syntax-check -i inventory.ini.example
      - run: ansible-lint site.yml

  security-scan:
    name: IaC security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Report only for now. Flip --exit-code to 1 once findings are triaged
      # and the accepted ones are listed in .trivyignore with a reason.
      - name: Trivy config scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest config \
            --severity MEDIUM,HIGH,CRITICAL --ignorefile .trivyignore --exit-code 0 .

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [go]
    strategy:
      matrix:
        image: [status-api, dns, ntp]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.image }}
          push: false
          tags: local/${{ matrix.image }}:ci

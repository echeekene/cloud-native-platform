# Upstream: Amazon Time Sync (link local, inside AWS) plus public pools
server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4
pool time.cloudflare.com iburst nts maxsources 2
pool 2.pool.ntp.org iburst maxsources 2

# Serve time to the VPC and the Kubernetes pod network only
allow 10.20.0.0/16
allow 10.42.0.0/16
allow 10.43.0.0/16
# Docker networks for local testing with docker compose
allow 172.16.0.0/12

# Keep answering at a high stratum if every upstream disappears,
# so clients see degraded time instead of no time
local stratum 10 orphan

driftfile /var/lib/chrony/chrony.drift
makestep 1.0 3
rtcsync

# Rate limit clients to blunt amplification abuse
ratelimit interval 1 burst 16

# No remote control port
cmdport 0

logdir /var/log/chrony
log measurements statistics tracking
